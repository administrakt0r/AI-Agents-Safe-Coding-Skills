name: Auto-Merge Trusted PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_run:
    types: [completed]
    workflows: ["Skills Registry CI", "Skill Review & Optimize"]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request ||
      (github.event.check_suite && github.event.check_suite.pull_requests[0]) ||
      (github.event.workflow_run && github.event.workflow_run.event == 'pull_request')
    steps:
      - name: Determine PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber, prAuthor, prTitle, prBranch;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prAuthor = context.payload.pull_request.user.login;
              prTitle = context.payload.pull_request.title;
              prBranch = context.payload.pull_request.head.ref;
            } else if (context.eventName === 'check_suite') {
              const prs = context.payload.check_suite.pull_requests;
              if (!prs || prs.length === 0) {
                core.setOutput('skip', 'true');
                return;
              }
              prNumber = prs[0].number;
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prAuthor = pr.data.user.login;
              prTitle = pr.data.title;
              prBranch = pr.data.head.ref;
            } else if (context.eventName === 'workflow_run') {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'pull_request',
                per_page: 50
              });
              // Find the associated PR from the workflow run
              const headBranch = context.payload.workflow_run.head_branch;
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${headBranch}`
              });
              if (pulls.data.length === 0) {
                core.setOutput('skip', 'true');
                return;
              }
              prNumber = pulls.data[0].number;
              prAuthor = pulls.data[0].user.login;
              prTitle = pulls.data[0].title;
              prBranch = pulls.data[0].head.ref;
            }

            core.setOutput('pr_number', prNumber);
            core.setOutput('pr_author', prAuthor);
            core.setOutput('pr_title', prTitle);
            core.setOutput('pr_branch', prBranch);

            // Trusted authors: owner, collaborators
            const trustedAuthors = ['administrakt0r', 'grayfoxer'];
            const isTrustedAuthor = trustedAuthors.includes(prAuthor);

            // Trusted branch patterns: jules bot creates branches with jules- prefix
            const isJulesBranch = prBranch && prBranch.startsWith('jules-');

            // Auto-merge eligible label
            const isAutoMergeLabel = false; // Can be extended

            const shouldAutoMerge = isTrustedAuthor || isJulesBranch;
            core.setOutput('should_auto_merge', shouldAutoMerge ? 'true' : 'false');
            core.setOutput('is_trusted_author', isTrustedAuthor ? 'true' : 'false');
            core.setOutput('is_jules_branch', isJulesBranch ? 'true' : 'false');

      - name: Skip if not eligible
        if: steps.pr-context.outputs.skip == 'true' || steps.pr-context.outputs.should_auto_merge != 'true'
        run: |
          echo "PR not eligible for auto-merge."
          echo "Author: ${{ steps.pr-context.outputs.pr_author }}"
          echo "Branch: ${{ steps.pr-context.outputs.pr_branch }}"
          echo "Trusted author: ${{ steps.pr-context.outputs.is_trusted_author }}"
          echo "Jules branch: ${{ steps.pr-context.outputs.is_jules_branch }}"

      - name: Enable auto-merge
        if: steps.pr-context.outputs.should_auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr-context.outputs.pr_number }}"
          echo "Enabling auto-merge for PR #${PR}..."
          echo "Author: ${{ steps.pr-context.outputs.pr_author }}"
          echo "Branch: ${{ steps.pr-context.outputs.pr_branch }}"

          # Enable GitHub's native auto-merge (squash)
          gh pr merge "${PR}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch \
            2>&1 || {
              echo "::notice::Auto-merge enable failed (may have conflicts or checks pending). Will retry on next event."
            }
